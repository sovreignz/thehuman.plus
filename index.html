                             )
                        })}
                    </div>
                </div>
            );
        };

        const LensPill = ({ id, active, onClick }) => (
            <button
                onClick={onClick}
                className={`
                    px-5 py-2 rounded-full text-sm font-medium transition-all duration-300
                    ${active 
                        ? 'glass-pill-active transform scale-105' 
                        : 'glass-pill text-gray-500 hover:text-brand-500'}
                `}
            >
                {LENS_LABELS[id]}
            </button>
        );

        const AgentInsight = ({ tip }) => (
            <div className="glass-panel p-5 rounded-2xl flex items-start gap-4 border-l-4 border-l-brand-500 relative overflow-hidden group">
                <div className="absolute top-0 right-0 w-24 h-24 bg-brand-500/10 rounded-full blur-2xl transform translate-x-12 -translate-y-12"></div>
                <div className="relative flex-shrink-0">
                    <img 
                        src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=200&h=200" 
                        alt="Agent Profile" 
                        className="w-14 h-14 rounded-full object-cover border-2 border-white shadow-md"
                    />
                    <div className="absolute -bottom-1 -right-1 bg-brand-900 text-white p-1 rounded-full border border-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
                    </div>
                </div>
                <div className="relative z-10">
                    <h4 className="text-[10px] font-bold text-brand-500 uppercase tracking-widest mb-1 flex items-center gap-1">
                        Agent Insight
                    </h4>
                    <p className="text-sm text-gray-700 italic leading-relaxed">"{tip}"</p>
                </div>
            </div>
        );

        const StatCircle = ({ percent, label, value }) => (
            <div className="flex flex-col items-center space-y-2">
                <div className="relative w-20 h-20">
                    <svg className="w-full h-full transform -rotate-90">
                        <circle cx="40" cy="40" r="36" stroke="currentColor" strokeWidth="6" fill="transparent" className="text-brand-500/20" />
                        <circle cx="40" cy="40" r="36" stroke="currentColor" strokeWidth="6" fill="transparent" 
                            strokeDasharray={226} 
                            strokeDashoffset={226 - (226 * percent / 100)}
                            className="text-white transition-all duration-1000 ease-out" 
                        />
                    </svg>
                    <div className="absolute top-0 left-0 w-full h-full flex items-center justify-center font-bold text-white">
                        {value}
                    </div>
                </div>
                <span className="text-xs uppercase tracking-wider text-brand-100 text-center">{label}</span>
            </div>
        );

        const StatBar = ({ percent, label, value }) => (
            <div className="w-full">
                <div className="flex justify-between text-sm mb-1">
                    <span className="text-brand-100 font-medium">{label}</span>
                    <span className="font-bold text-white">{value}</span>
                </div>
                <div className="h-2 bg-brand-500/30 rounded-full overflow-hidden backdrop-blur-sm">
                    <div 
                        className="h-full bg-white rounded-full transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(255,255,255,0.5)]"
                        style={{ width: `${percent}%` }}
                    ></div>
                </div>
            </div>
        );

        const FAQItem = ({ q, a }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-gray-200/50 last:border-0">
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full text-left py-4 flex justify-between items-center group"
                    >
                        <span className="font-medium text-gray-800 group-hover:text-brand-500 transition-colors">{q}</span>
                        <span className={`transform transition-transform ${isOpen ? 'rotate-180' : ''}`}>
                             <Icons.ArrowRight />
                        </span>
                    </button>
                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-24 opacity-100 mb-4' : 'max-h-0 opacity-0'}`}>
                        <p className="text-sm text-gray-600 pr-4">{a}</p>
                    </div>
                </div>
            );
        };
        
        // --- HIDDEN BROCHURE COMPONENT (For PDF Generation) ---
        const BrochureContent = ({ activeLens }) => (
            <div id="brochure-content" className="p-8 bg-white text-slate-800 font-sans">
                <div className="mb-10 text-center border-b-2 border-brand-500 pb-6">
                    <h1 className="text-4xl font-serif font-bold text-brand-900 mb-2">1240 Highland Avenue</h1>
                    <p className="text-lg text-brand-500 uppercase tracking-widest">{LENS_LABELS[activeLens]} Information Packet</p>
                </div>
                
                {TAB_ORDER.map(key => {
                    const section = CONTENT[key];
                    const lensInfo = section.lenses[activeLens];
                    
                    return (
                        <div key={key} className="mb-8 break-inside-avoid">
                            <h2 className="text-2xl font-serif font-bold text-brand-900 mb-3 border-l-4 border-brand-500 pl-3">{section.title}</h2>
                            <p className="mb-4 text-gray-700 leading-relaxed">{lensInfo.summary}</p>
                            
                            <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Highlights</h3>
                                <ul className="list-disc list-inside text-sm text-gray-700 grid grid-cols-2 gap-2">
                                    {lensInfo.highlights.map(h => <li key={h}>{h}</li>)}
                                </ul>
                            </div>
                            
                            {section.agentTip && (
                                <div className="text-sm italic text-brand-500 border-l-2 border-brand-500 pl-3 py-1 bg-brand-50/50 mb-4">
                                    Agent Tip: {section.agentTip}
                                </div>
                            )}
                        </div>
                    )
                })}
                
                <div className="mt-12 text-center text-xs text-gray-400">
                    Generated from Interactive Listing Site · {new Date().toLocaleDateString()}
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('kitchen');
            const [activeLens, setActiveLens] = useState('single');
            const [animating, setAnimating] = useState(false);
            const [generatingPdf, setGeneratingPdf] = useState(false);

            const currentData = CONTENT[activeTab];
            const lensData = currentData.lenses[activeLens];

            // Handle tab switch animation
            useEffect(() => {
                setAnimating(true);
                const timer = setTimeout(() => setAnimating(false), 400);
                return () => clearTimeout(timer);
            }, [activeTab]);
            
            // PDF Generation Function
            const handleDownloadPdf = () => {
                setGeneratingPdf(true);
                const element = document.getElementById('brochure-content');
                element.style.display = 'block'; // Temporarily show for capture
                
                const opt = {
                    margin: 1,
                    filename: `1240_Highland_${activeLens}_Overview.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    element.style.display = 'none';
                    setGeneratingPdf(false);
                });
            };

            return (
                <div className="flex min-h-screen">
                    {/* Render hidden brochure content */}
                    <BrochureContent activeLens={activeLens} />
                
                    {/* Desktop Sidebar (Glass) */}
                    <aside className="hidden md:flex flex-col w-64 lg:w-72 glass-nav fixed h-full z-10">
                        <div className="p-8 pb-4">
                            <h2 className="text-2xl font-serif font-bold text-brand-900 leading-tight">1240 Highland</h2>
                            <p className="text-sm text-brand-500 font-medium mt-1">$850,000 · Active</p>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4">
                            {TAB_ORDER.map(key => (
                                <NavButton 
                                    key={key} 
                                    id={key} 
                                    active={activeTab === key} 
                                    onClick={() => {
                                        window.scrollTo(0,0);
                                        setActiveTab(key);
                                    }}
                                >
                                    {CONTENT[key].title}
                                </NavButton>
                            ))}
                        </nav>
                        
                        {/* New Sidebar Contact Section */}
                        <div className="p-6 border-t border-white/30 space-y-3">
                             <div className="grid grid-cols-2 gap-3">
                                <button className="flex flex-col items-center justify-center p-3 rounded-xl bg-white/40 hover:bg-brand-500 hover:text-white transition-all text-brand-900 border border-white/50 backdrop-blur-md shadow-sm group">
                                    <Icons.Phone />
                                    <span className="text-[10px] font-bold uppercase mt-1 tracking-wider">Call</span>
                                </button>
                                <button className="flex flex-col items-center justify-center p-3 rounded-xl bg-white/40 hover:bg-brand-500 hover:text-white transition-all text-brand-900 border border-white/50 backdrop-blur-md shadow-sm group">
                                    <Icons.Mail />
                                    <span className="text-[10px] font-bold uppercase mt-1 tracking-wider">Email</span>
                                </button>
                             </div>
                             
                             <button 
                                onClick={handleDownloadPdf}
                                disabled={generatingPdf}
                                className="w-full flex items-center justify-center space-x-2 py-3 bg-brand-900 text-white font-medium rounded hover:bg-brand-500 transition-colors shadow-lg shadow-brand-500/30 text-sm"
                            >
                                {generatingPdf ? (
                                    <span>Generating...</span>
                                ) : (
                                    <>
                                        <Icons.Download />
                                        <span>Download PDF</span>
                                    </>
                                )}
                            </button>
                        </div>
                    </aside>

                    {/* Mobile Nav */}
                    <MobileNav activeTab={activeTab} onTabChange={(t) => {
                        window.scrollTo(0,0);
                        setActiveTab(t);
                    }} />

                    {/* Main Content Area */}
                    <main className="flex-1 md:ml-64 lg:ml-72 pt-24 md:pt-0 w-full transition-opacity duration-300">
                        
                        {/* Hero Section of the Page */}
                        <div className="max-w-4xl mx-auto px-6 py-8 md:py-16">
                            
                            {/* Header */}
                            <div className={`transition-all duration-500 ${animating ? 'opacity-0 translate-y-4' : 'opacity-100 translate-y-0'}`}>
                                <h1 className="text-4xl md:text-5xl font-serif font-bold text-gray-900 mb-2 drop-shadow-sm">
                                    {currentData.title}
                                </h1>
                                <div className="h-1 w-20 bg-brand-500 mb-8 rounded-full shadow-sm"></div>
                            </div>

                            {/* Lens Selector */}
                            <div className="mb-10">
                                <div className="flex justify-between items-end mb-3">
                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest">Select Your Perspective</p>
                                    <span className="text-[10px] text-brand-500 bg-brand-50 px-2 py-1 rounded hidden md:inline-block">PDF will match selected lens</span>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {LENS_ORDER.map(lens => (
                                        <LensPill 
                                            key={lens} 
                                            id={lens} 
                                            active={activeLens === lens} 
                                            onClick={() => setActiveLens(lens)} 
                                        />
                                    ))}
                                </div>
                            </div>

                            {/* Dynamic Content Block */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                
                                {/* Left Column: Description & Highlights */}
                                <div className="lg:col-span-2 space-y-8">
                                    <div className={`glass-panel rounded-2xl p-8 transition-all duration-500 ${animating ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                                        <div className="flex items-center space-x-2 mb-4 text-brand-500">
                                            <Icons.Check />
                                            <span className="text-sm font-bold uppercase tracking-wider">{LENS_LABELS[activeLens]} View</span>
                                        </div>
                                        <p className="text-lg leading-relaxed text-gray-800 font-light font-serif">
                                            {lensData.summary}
                                        </p>
                                    </div>

                                    {/* Agent Expertise Section - NEW */}
                                    <div className={`transition-all duration-500 delay-100 ${animating ? 'opacity-0 translate-y-2' : 'opacity-100 translate-y-0'}`}>
                                        <AgentInsight tip={currentData.agentTip} />
                                    </div>

                                    {/* Highlights Grid */}
                                    <div>
                                        <h3 className="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4 pl-2">Highlights</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            {lensData.highlights.map((h, i) => (
                                                <div key={i} className="flex items-start space-x-2 p-3 glass-panel rounded-lg hover:bg-white/60 transition-colors cursor-default">
                                                    <div className="mt-1 text-brand-500">
                                                        <Icons.Check />
                                                    </div>
                                                    <span className="text-sm font-medium text-gray-700">{h}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* FAQ Section */}
                                    <div className="pt-8">
                                        <h3 className="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4 pl-2">Questions asked by {activeLens === 'investor' ? 'Investors' : 'Buyers'}</h3>
                                        <div className="glass-panel rounded-xl">
                                            {currentData.faq.map((item, i) => (
                                                <FAQItem key={i} q={item.q} a={item.a} />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Right Column: Data Viz */}
                                <div className="lg:col-span-1">
                                    <div className="glass-card-dark rounded-2xl p-6 text-white sticky top-8 border-t border-white/20">
                                        <h3 className="text-sm font-bold text-brand-100 uppercase tracking-wider mb-6 border-b border-brand-500/30 pb-2">Data Points</h3>
                                        
                                        <div className="space-y-8">
                                            {currentData.stats.map((stat, i) => (
                                                <div key={i}>
                                                    {stat.type === 'circle' ? (
                                                        <div className="flex justify-center py-2">
                                                            <StatCircle percent={stat.percent} label={stat.label} value={stat.value} />
                                                        </div>
                                                    ) : (
                                                        <StatBar percent={stat.percent} label={stat.label} value={stat.value} />
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="mt-8 pt-6 border-t border-brand-500/30 text-center">
                                            <p className="text-xs text-brand-100 italic">Data updated: Jan 2026</p>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            
                            {/* Footer for scrolling space */}
                            <div className="h-32"></div>
                        </div>
                    </main>

                    {/* Mobile Call to Action (Sticky Bottom) - UPDATED */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 p-4 glass-panel border-t border-white/40 z-50">
                        <div className="grid grid-cols-2 gap-3">
                            <button className="flex items-center justify-center space-x-2 py-3 bg-white text-brand-900 font-bold border-2 border-brand-900 rounded hover:bg-gray-50 transition-colors shadow-lg">
                                <Icons.Phone />
                                <span>Call</span>
                            </button>
                            <button className="flex items-center justify-center space-x-2 py-3 bg-brand-900 text-white font-bold rounded hover:bg-brand-800 transition-colors shadow-lg">
                                <Icons.Mail />
                                <span>Email</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
